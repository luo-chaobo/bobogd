<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">部署与受保护数据流（生产事实待线上验证）</title><desc id="desc">浏览器 / 客户与客服; 微信 / 小程序客户端; Nginx / HTTPS / 反向代理边界; Node 应用 / 鉴权、业务与接口适配; SQLite 业务数据库 / 仅应用服务访问; 私有 OSS 附件存储 / 短时受控访问; 波波 HTTPS 集成 / 签名、幂等与重试; 备份边界 / 私有备份对象； / 不进入共享盘; 待线上验证的 ECS 运行边界（Nginx、Node、SQLite）</desc><defs>

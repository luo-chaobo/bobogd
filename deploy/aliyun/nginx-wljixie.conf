server {
    listen 80;
    server_name wljixie.com www.wljixie.com;
    return 301 https://wljixie.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wljixie.com;

    ssl_certificate /etc/nginx/ssl/wljixie.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wljixie.com/private.key;

    client_max_body_size 60m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    server_name www.wljixie.com;
    ssl_certificate /etc/nginx/ssl/wljixie.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wljixie.com/private.key;
    return 301 https://wljixie.com$request_uri;
}

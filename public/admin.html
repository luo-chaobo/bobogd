<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客服工作台｜未来机械</title><link rel="icon" href="/assets/brand/wl-favicon-32.png" type="image/png"><meta property="og:image" content="https://wljixie.com/assets/brand/wl-social-card-1200x630.jpg"><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-page"><header class="site-header"><a class="brand" href="/"><span>WL</span><strong>客服工作台<small>快速接单与订单进度</small></strong></a><label>后台令牌<input id="admin-token" type="password" autocomplete="current-password"></label><button id="load-admin" class="button button-small">进入工作台</button></header><main class="section"><div class="section-heading"><p class="eyebrow">内部后台</p><h1>新需求与履约节点</h1><p>令牌仅保存在当前浏览器会话。生产环境必须使用强令牌并通过HTTPS访问。</p></div><div id="admin-summary" class="promise-bar"><span>待载入</span></div><h2>询价需求</h2><div id="inquiry-list" class="service-grid" aria-live="polite"></div><h2>正式订单</h2><div id="order-list" class="service-grid" aria-live="polite"></div></main><dialog id="workflow-dialog"><form id="workflow-form" method="dialog" class="form-card"><h2 id="workflow-title">处理需求</h2><input name="inquiryId" type="hidden"><label>操作人<input name="operator" required value="客服"></label><label>报价金额<input name="amount" type="number" min="0.01" step="0.01" required></label><label>报价有效期<input name="validUntil" type="date" required></label><button name="action" value="claim" class="button" type="button">认领需求</button><button name="action" value="quote" class="button" type="button">创建并确认报价</button><button name="action" value="pay" class="button" type="button">确认全额到账并建单</button><button class="button button-ghost" type="button" data-close>关闭</button><p id="workflow-result" class="form-result" aria-live="polite"></p></form></dialog><dialog id="event-dialog"><form id="event-form" class="form-card"><h2>更新公开进度</h2><input name="orderId" type="hidden"><label>操作人<input name="operator" required value="客服"></label><label>进度状态<select name="status"><option value="production">生产中</option><option value="quality">质检中</option><option value="ready">待交付</option><option value="completed">已完成</option></select></label><label>客户可见说明<input name="title" required placeholder="如：已进入折弯工序"></label><button class="button" type="submit">发布进度</button><button class="button button-ghost" type="button" data-event-close>关闭</button><p id="event-result" class="form-result" aria-live="polite"></p></form></dialog><script src="/admin.js"></script></body></html>

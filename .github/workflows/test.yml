name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node --experimental-strip-types --test --test-force-exit test/*.test.js
